<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="720" cy="180" r="160" fill="#5eead4" opacity="0.18" filter="url(#soft)"/>
  <circle cx="160" cy="980" r="190" fill="#99f6e4" opacity="0.12" filter="url(#soft)"/>

  <!-- rack cards -->
  <g transform="translate(120 220)">
    <rect width="660" height="140" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="56" cy="70" r="10" fill="#34d399"/>
    <rect x="90" y="48" width="220" height="14" rx="7" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="90" y="76" width="160" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="430" y="40" width="180" height="60" rx="14" fill="#ffffff" fill-opacity="0.1"/>
    <path d="M450 70 H580" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="470" cy="70" r="4" fill="#5eead4"/>
    <circle cx="520" cy="58" r="4" fill="#99f6e4"/>
    <circle cx="560" cy="78" r="4" fill="#5eead4"/>
  </g>

  <g transform="translate(120 400)">
    <rect width="660" height="140" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="56" cy="70" r="10" fill="#34d399"/>
    <rect x="90" y="48" width="250" height="14" rx="7" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="90" y="76" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="430" y="36" width="180" height="68" rx="14" fill="#ffffff" fill-opacity="0.1"/>
    <polyline points="450,88 480,60 510,74 540,48 580,66" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(120 580)">
    <rect width="660" height="140" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="56" cy="70" r="10" fill="#f87171"/>
    <rect x="90" y="48" width="200" height="14" rx="7" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="90" y="76" width="170" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="430" y="40" width="180" height="60" rx="14" fill="#ffffff" fill-opacity="0.1"/>
    <text x="470" y="76" fill="#fecaca" font-family="ui-monospace, monospace" font-size="18">404 DOWN</text>
  </g>

  <g transform="translate(120 820)">
    <rect width="660" height="220" rx="26" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="48" y="70" fill="#ffffff" fill-opacity="0.9" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="600">Live uptime feed</text>
    <text x="48" y="112" fill="#ffffff" fill-opacity="0.55" font-family="Manrope, Arial, sans-serif" font-size="20">Status · latency · alerts</text>
    <rect x="48" y="150" width="120" height="36" rx="18" fill="#14b8a6"/>
    <text x="70" y="174" fill="#042f2e" font-family="ui-monospace, monospace" font-size="14" font-weight="700">LIVE</text>
    <rect x="184" y="150" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.12"/>
    <text x="204" y="174" fill="#ffffff" fill-opacity="0.8" font-family="ui-monospace, monospace" font-size="14">99.8% up</text>
  </g>
</svg>
